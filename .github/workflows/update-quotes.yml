name: update-quotes
on:
  schedule:
    - cron: '0 22 * * 0-4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas pyarrow
      - run: python scripts/update_quotes.py
      - run: python scripts/update_floors.py
      - name: commit if changed
        run: |
          git config user.name "quotes-bot"
          git config user.email "quotes-bot@users.noreply.github.com"
          git add data/quotes.json data/rockbottom.json
          git diff --cached --quiet || git commit -m "quotes: auto update"
          git push
